<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BASS ROULETTE: MAXFIY SEYF🔐🗄️</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Impact', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #05020a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            position: relative;
        }

        /* Continuous Dynamic Dopamine Background Blur Blob Animations */
        .bg-blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            border-radius: 50%;
            z-index: 0;
            animation: moveBlob 6s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 250px;
            height: 250px;
            background: #ff0055;
            top: -50px;
            left: -50px;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: #7900ff;
            bottom: -50px;
            right: -50px;
            animation-duration: 8s;
            animation-direction: alternate-reverse;
        }

        .blob-3 {
            width: 200px;
            height: 200px;
            background: #00f0ff;
            top: 40%;
            left: 20%;
            animation-duration: 5s;
        }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 80px) scale(1.3); }
            100% { transform: translate(-40px, 40px) scale(0.9); }
        }

        /* Glassmorphism Container */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: space-between;
        }

        /* Header Neon Pulse */
        .title {
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055;
            animation: neonPulse 1.2s infinite alternate;
            margin-top: 10px;
        }

        @keyframes neonPulse {
            0% { text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
            100% { text-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff, 0 0 60px #00f0ff; }
        }

        .subtitle {
            font-size: 13px;
            color: #d1c4e9;
            font-family: sans-serif;
            margin-top: 5px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Roulette Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            margin: auto 0;
        }

        .card {
            background: rgba(20, 10, 35, 0.6);
            border: 2px solid rgba(255, 0, 85, 0.4);
            border-radius: 18px;
            height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: all 0.2s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            overflow: hidden;
            animation: cardFloat 3s infinite alternate ease-in-out;
        }

        .card:nth-child(2) { animation-delay: 0.5s; }
        .card:nth-child(3) { animation-delay: 1s; }
        .card:nth-child(4) { animation-delay: 1.5s; }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        .card:active {
            transform: scale(0.95);
        }

        .card-icon {
            font-size: 42px;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px #ff0055);
        }

        .card-title {
            font-size: 14px;
            color: #fff;
            letter-spacing: 1px;
        }

        /* Dynamic Shake Animation on Loss */
        .shake {
            animation: shakeAnim 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeAnim {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* Modal Overlay */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 1, 15, 0.85);
            backdrop-filter: blur(25px);
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
        }

        .modal-content {
            background: rgba(30, 15, 50, 0.8);
            border: 2px solid #00f0ff;
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 0 50px #00f0ff;
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 22px;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #00f0ff;
        }

        .modal-desc {
            font-size: 14px;
            font-family: sans-serif;
            color: #e0e0e0;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        /* High Dopamine Pulsing Button */
        .btn-action {
            background: linear-gradient(45deg, #ff0055, #7900ff);
            border: none;
            color: #fff;
            padding: 16px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 0 25px #ff0055;
            animation: btnPulse 1s infinite alternate;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 15px #ff0055; transform: scale(1); }
            100% { box-shadow: 0 0 35px #00f0ff, 0 0 15px #ff0055; transform: scale(1.03); }
        }

        .timer-box {
            font-size: 18px;
            color: #ff0055;
            margin: 10px 0;
            font-weight: bold;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- Continuous Animated Dynamic Background Blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="container">
        <div>
            <h1 class="title">⚡️ BASS ROULETTE ⚡️</h1>
            <div class="subtitle">🔥 TAVAKKAL QIL: VIP TREK YOKI BAN?</div>
        </div>

        <!-- 4 Russian Roulette Cards -->
        <div class="cards-grid" id="cardsGrid">
            <div class="card" onclick="playRoulette(1)">
                <div class="card-icon">🎴</div>
                <div class="card-title">1-SEYF</div>
            </div>
            <div class="card" onclick="playRoulette(2)">
                <div class="card-icon">🎴</div>
                <div class="card-title">2-SEYF</div>
            </div>
            <div class="card" onclick="playRoulette(3)">
                <div class="card-icon">🎴</div>
                <div class="card-title">3-SEYF</div>
            </div>
            <div class="card" onclick="playRoulette(4)">
                <div class="card-icon">🎴</div>
                <div class="card-title">4-SEYF</div>
            </div>
        </div>

        <div style="font-family: sans-serif; font-size: 11px; opacity: 0.6; margin-bottom: 10px;">
            🔒 TIZIM TELEGRAM BASS ENGINE BILAN ULANGAN
        </div>
    </div>

    <!-- Modal Window (Win/Loss) -->
    <div class="modal" id="gameModal">
        <div class="modal-content" id="modalContent">
            <div class="modal-icon" id="modalIcon">👑</div>
            <div class="modal-title" id="modalTitle">BOSH YUTUQ!</div>
            <div class="timer-box" id="timerBox">04:59</div>
            <div class="modal-desc" id="modalDesc">
                Siz bazadagi eng daxshatli VIP Bass trekni yutib oldingiz! Lekin u 5 daqiqada o'chib ketadi.
            </div>
            <button class="btn-action" id="modalBtn" onclick="handleAction()">SAQLASH UCHUN ULASHISH 🚀</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let userStatus = "NEW"; 
        let currentUserId = tg.initDataUnsafe?.user?.id || 12345678;

        // Sound Effects Synthesizer (No external mp3 required)
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            } else if (type === 'loss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
                document.body.classList.add('shake');
                setTimeout(() => document.body.classList.remove('shake'), 500);
            }
        }

        // Russian Roulette Logic
        function playRoulette(cardIndex) {
            playSound('click');
            
            // Random result calculation (30% Win, 70% Rescue Requirement)
            let isWin = Math.random() < 0.3;

            setTimeout(() => {
                const modal = document.getElementById('gameModal');
                const modalContent = document.getElementById('modalContent');
                const modalIcon = document.getElementById('modalIcon');
                const modalTitle = document.getElementById('modalTitle');
                const modalDesc = document.getElementById('modalDesc');
                const modalBtn = document.getElementById('modalBtn');

                modal.style.display = 'flex';

                if (isWin) {
                    playSound('win');
                    userStatus = "WIN_LOCKED";
                    modalContent.style.borderColor = "#00f0ff";
                    modalContent.style.boxShadow = "0 0 50px #00f0ff";
                    modalIcon.innerHTML = "👑";
                    modalTitle.innerHTML = "BOSH YUTUQ!";
                    modalTitle.style.color = "#00f0ff";
                    modalDesc.innerHTML = "🔥 DAXSHAT! Siz eng yopiq VIP Bass trekni ochdingiz! Lekin u <b>5 daqiqa</b>dan keyin avtomatik o'chib ketadi. Saqlash uchun uni darhol do'stingizga yuboring!";
                    modalBtn.innerHTML = "SAQLASH UCHUN ULASHISH 🚀";
                    startTimer(300);
                } else {
                    playSound('loss');
                    userStatus = "LOST_BLOCKED";
                    modalContent.style.borderColor = "#ff0055";
                    modalContent.style.boxShadow = "0 0 50px #ff0055";
                    modalIcon.innerHTML = "💀";
                    modalTitle.innerHTML = "PORTLASH SODIR BO'LDI!";
                    modalTitle.style.color = "#ff0055";
                    document.getElementById('timerBox').style.display = 'none';
                    modalDesc.innerHTML = "❌ Afsus! Siz minalashtirilgan seyfni tanladingiz. Kanalning eksklyuziv bazasiga kirish bloklandi! Qutqaruv uchun do'stingizga xabar yuboring va blokdan chiqing.";
                    modalBtn.innerHTML = "DO'ST BASHARASIGA TASHASH & QUTQARISH 🚨";
                }
            }, 300);
        }

        // Timer Function
        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const timerBox = document.getElementById('timerBox');
            timerBox.style.display = 'block';
            let interval = setInterval(() => {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                timerBox.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(interval);
                    timerBox.textContent = "VAQT TUGADI!";
                }
            }, 1000);
        }

        // Dopamine Share Trigger using Telegram Deep Link
        async function handleAction() {
            playSound('click');
            
            // Node.js Backend'dan bot username'ini olish so'rovi
            let botUsername = "your_bot_username"; // Default
            try {
                let res = await fetch('/api/get-bot-info');
                let data = await res.json();
                if (data.username) botUsername = data.username;
            } catch (e) {
                console.log("Bot username olishda xato:", e);
            }

            let shareText = "";

            if (userStatus === "WIN_LOCKED") {
                shareText = `🚨 VOQEALIKNI TARK ET! Men BASS ROULETTE'da 🔞 yopiq VIP trekni yutib oldim! 🔥\nLekin u 5 daqiqada o'chib ketadi! Kirib ko'r yoki g'alaba kalitini saqlashga yordam ber 👇`;
            } else {
                shareText = `💀 SHOK! Men BASS ROULETTE'da portlab ketdim va kanal bazasidan bloklandim! 😭\nMeni qutqarish uchun shu havolaga bos va seyfni ochib ber! 👇`;
            }

            let shareUrl = `https://t.me/share/url?url=https://t.me/${botUsername}?start=ref_${currentUserId}&text=${encodeURIComponent(shareText)}`;
            
            tg.openTelegramLink(shareUrl);
        }
    </script>
</body>
</html>
